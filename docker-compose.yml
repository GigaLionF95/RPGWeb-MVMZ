services:
  rpgm-web:
    build: .
    image: rpgm-web
    restart: unless-stopped
    ports:
      # Change the left number to use another port: RPGM_HTTP_PORT=9000 in a .env file
      - "${RPGM_HTTP_PORT:-8080}:8080"
    volumes:
      # Game library, server config and admin token. A named volume,
      # so Docker sets the right owner on Linux (a ./data folder would be root's).
      - rpgm-data:/data
      # Put game archives here to import them from the command line:
      #   docker compose exec rpgm-web node /app/bin/rpgm-web.js import "/imports/My Game.zip"
      - ./imports:/imports:ro
    environment:
      # Fixed admin token for the web UI / API (otherwise one is generated)
      # RPGM_ADMIN_TOKEN: change-me
      # Hide the game list from visitors without the token
      # RPGM_PUBLIC_LIBRARY: "0"
      RPGM_MAX_UPLOAD_GB: "8"

volumes:
  rpgm-data:
